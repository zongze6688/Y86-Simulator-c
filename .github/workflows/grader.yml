name: Y86-64 Simulator Autograder

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: y86-simulator-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    name: Run Y86-64 Simulation Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build simulator
        run: make cpu
      - name: Run autograder
        run: python3 test.py --bin ./cpu
